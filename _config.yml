theme: jekyll-theme-minimal
title: Lainey's homepage
description: Bookmark this to keep an eye on my project updates!


bash

mkdir -p /home/claude/site
cat > /home/claude/site/notes.md << 'EOF'
# Design plan

Color:
--paper:  #F3ECDD  warm kraft/linen background
--ink:    #2A241C  warm near-black text
--ink-soft: #5B4F3F  secondary text
--teal:   #1E6F6A  primary accent (pulled from the Caribou packaging renders)
--clay:   #B5502A  secondary accent (warm brick, used sparingly)
--card:   #EAE0C8  section/card alt background
--line:   #D8CBAE  hairline dividers

Type:
Display: Fraunces (warm organic serif, has personality without being a stunt font)
Body: Work Sans (humanist sans, friendly, good at small sizes)

Layout:
- Left-aligned throughout, not centered/boxed
- Hero: text left, scattered/pinned photo collage right (tilted images, corkboard feel) instead of default hero-image-right treatment
- Category sections: CSS-column masonry galleries (organic, matches varied art aspect ratios) rather than uniform cards
- Nav: plain wordmark + text links, sticky, no hamburger icon on desktop
- No numbered eyebrows (content isn't a sequence), no all-caps labels, no arrow-suffixed buttons

Principle: the corkboard/studio-wall hero and masonry galleries are the signature move; everything else (nav, type, footer) stays quiet.
EOF
echo written
